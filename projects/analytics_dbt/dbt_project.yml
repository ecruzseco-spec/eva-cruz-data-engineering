name: eva_portfolio_analytics
version: "1.0.0"
config-version: 2
profile: eva_portfolio_analytics

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  eva_portfolio_analytics:
    staging:
      +materialized: view
      +schema: staging_analytics
    marts:
      +materialized: table
      +schema: analytics
    metrics:
      +materialized: view
      +schema: analytics

vars:
  inject_invalid_relationship: false
