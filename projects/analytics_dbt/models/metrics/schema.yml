version: 2

models:
  - name: daily_transaction_metrics
    description: >-
      Métricas por fecha, moneda y estado. transaction_count cuenta transacciones;
      gross_amount suma importes; average_amount calcula el importe promedio.
    columns:
      - name: date_key
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: status
        data_tests: [not_null]
      - name: transaction_count
        data_tests: [not_null]
      - name: gross_amount
        data_tests: [not_null]
