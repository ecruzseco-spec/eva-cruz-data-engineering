[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eva-data-engineering-portfolio"
version = "1.0.0"
description = "Demostraciones sintéticas de ingeniería de datos con DuckDB y dbt"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-duckdb==1.11.0",
  "duckdb==1.5.6",
  "pydantic==2.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
