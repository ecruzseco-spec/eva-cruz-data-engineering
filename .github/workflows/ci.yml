name: portfolio-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run full local-equivalent validation
        run: PYTHONPATH=src python scripts/validate_portfolio.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-evidence
          path: evidence/
